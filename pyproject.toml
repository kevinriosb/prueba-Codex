[project]
name = "agente-personal"
version = "0.1.0"
description = "Agente web privado con FastAPI y OpenAI Agents SDK"
requires-python = ">=3.12,<3.15"
dependencies = [
  "openai-agents==0.24.0",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic-settings==2.16.1",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.2",
  "defusedxml==0.7.1",
  "pillow==13.0.0",
  "pypdf==6.21.2",
  "email-validator==2.3.0",
  "httpx2==2.16.0",
  "zxing-cpp==2.3.0",
]

[dependency-groups]
browser = [
    "playwright==1.64.1",
]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["error", "ignore:.*websockets.*:DeprecationWarning"]
