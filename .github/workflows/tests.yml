name: Pruebas del agente
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Instalar dependencias fijadas
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --group browser
      - name: Preparar Chromium para las pruebas de navegador
        run: |
          uv run --frozen --group browser playwright install --with-deps chromium
          uv run --frozen --group browser python - <<'PY'
          import subprocess
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              executable = Path(playwright.chromium.executable_path)
              if not executable.is_file():
                  raise SystemExit('No se instaló el Chromium de pruebas.')
              if not Path('/usr/bin/chromium').exists():
                  subprocess.run(['sudo', 'ln', '-s', str(executable), '/usr/bin/chromium'], check=True)
          PY
      - name: Pruebas sin API ni cargos
        run: uv run --frozen --group browser pytest -q
